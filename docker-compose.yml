services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crsms
      POSTGRES_USER: crsms
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-crsms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/crsms
      DATABASE_USERNAME: crsms
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-crsms}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campus.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PORT: 8080
    ports:
      - "8080:8080"
volumes:
  pgdata:
