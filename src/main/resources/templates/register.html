<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join | Campus Share</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="/home">Campus <span>Share</span></a><nav><a href="/browse">Browse</a><a href="/login">Sign in</a></nav></header>
<main class="auth-wrap"><section class="card auth-card"><p class="eyebrow">JOIN YOUR CAMPUS</p><h1>Create account</h1><div class="notice error" th:if="${error}" th:text="${error}"></div>
<form method="post" action="/register" class="stack"><label>Full name<input name="fullName" required maxlength="120"></label><label>Campus email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"></label><label>Member type<select name="role" required><option value="STUDENT">Student</option><option value="FACULTY">Faculty</option><option value="STAFF">Staff</option></select></label><label>Department<input name="department"></label><label>Member ID (optional)<input name="memberId"></label><button class="btn" type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login">Sign in</a>.</p></section></main></body></html>
