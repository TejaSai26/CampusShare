<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>List a resource | Campus Share</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="/home">Campus <span>Share</span></a><nav><a href="/browse">Browse</a><a href="/dashboard">Dashboard</a></nav></header>
<main class="auth-wrap"><section class="card auth-card wide"><p class="eyebrow">GIVE AN ITEM A SECOND LIFE</p><h1>List a resource</h1><div class="notice error" th:if="${error}" th:text="${error}"></div>
<form method="post" action="/listing/new" class="stack"><label>Resource title<input name="title" required maxlength="140" placeholder="e.g. Scientific calculator"></label><label>Description<textarea name="description" rows="4" required maxlength="2000"></textarea></label><label>Category<select name="categoryId" required><option value="">Choose category</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select></label><label>Pricing type<select name="pricingType"><option value="FREE">Free</option><option value="HOURLY">Hourly</option><option value="DAILY">Daily</option></select></label><label>Rate (enter 0 for free)<input type="number" name="rate" min="0" step="0.01" value="0" required></label><p class="muted">One available unit will be created automatically for this listing.</p><button class="btn" type="submit">Publish resource</button></form></section></main></body></html>
