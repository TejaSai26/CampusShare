server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: crsms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

crsms:
  seed-admin: true
  seed-demo: true
  admin:
    email: ${ADMIN_EMAIL:admin@campus.edu}
    password: ${ADMIN_PASSWORD:changeme}
    name: ${ADMIN_NAME:Campus Administrator}
